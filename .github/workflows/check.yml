name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-matches-episodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/build.py
      - name: HTML is generated from data/episodes.json
        run: git diff --exit-code -- index.html 404.html episodes
